# Render Blueprint — deploys the API straight from this repo's Dockerfile.
#
# Render's free web service sleeps after ~15 minutes idle and takes 30–60s to
# wake. Fine for a demo; if you need it always-on, the same Dockerfile deploys
# unchanged to Koyeb, which doesn't sleep but asks for a card at signup.
#
# A real database is the part that matters. Without one Laravel falls back to
# SQLite inside the container, which is wiped on every deploy — new accounts,
# uploads and admin content all disappear.
#
# The live deployment uses TiDB Cloud Serverless (MySQL-compatible, free with no
# expiry) with the DB_* values set in the dashboard. The PostgreSQL definition
# below is kept as the alternative: Render's own free tier is provisioned by this
# file and needs nothing pasted, but it is deleted after 30 days.
#
# Applying this Blueprint creates a SECOND service named himam-api with its own
# URL. The live service is himam-back, configured by hand; the two are not the
# same thing.

databases:
  # Free, and created with the service. Render's free tier expires after 30
  # days, which is a reminder to move to a paid instance before real readers
  # depend on it — not a reason to keep running on a filesystem that loses
  # everything on every deploy.
  - name: himam-db
    plan: free
    region: frankfurt
    databaseName: himam
    user: himam

services:
  - type: web
    name: himam-api
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: Himam
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_LOCALE
        value: ar
      - key: APP_FALLBACK_LOCALE
        value: en
      - key: LOG_LEVEL
        value: warning

      # Laravel's own tables, so no Redis is needed on a free tier.
      - key: SESSION_DRIVER
        value: database
      - key: QUEUE_CONNECTION
        value: database

      # The cache is the one thing that must NOT live in the database here.
      # The database is in another region, so every cache read was a network
      # round trip — the cache was costing more than the queries it exists to
      # avoid. On local disk a read is microseconds.
      #
      # A cache is disposable by definition: losing it on each deploy is
      # correct, and it refills on the first request that needs it. The one
      # thing to know is that it is per container, so an administrator editing
      # a language clears it only where their request landed. That is fine on
      # a single instance; move to Redis before running more than one.
      - key: CACHE_STORE
        value: file

      # Render generates this once and keeps it stable across deploys.
      - key: APP_KEY
        generateValue: false
        sync: false

      # Without this, Laravel falls back to SQLite in a file inside the
      # container: ephemeral (wiped on every deploy) and owned by root, so
      # request-time writes fail while boot-time migrations appear to succeed.
      # pgsql for the Blueprint's own PostgreSQL. The live himam-back service
      # overrides this with mysql for TiDB.
      - key: DB_CONNECTION
        value: pgsql

      # sync:false means "prompt me in the dashboard" — never commit these.
      - key: APP_URL
        sync: false
      - key: FRONTEND_URL
        sync: false
      # Filled from the database above, so there is nothing to copy across and
      # nothing to rotate by hand when the password changes.
      - key: DB_HOST
        fromDatabase:
          name: himam-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: himam-db
          property: port
      - key: DB_DATABASE
        fromDatabase:
          name: himam-db
          property: database
      - key: DB_USERNAME
        fromDatabase:
          name: himam-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: himam-db
          property: password

      # Set to true for the FIRST deploy only, to load the books, quizzes and
      # badges. Leaving it on would re-seed and duplicate the catalogue.
      - key: RUN_SEEDERS
        value: "false"
